services:
  ldes-watchman:
    #build: ./
    image: semtech/mu-javascript-template:latest
    restart: no
    environment:
      NODE_ENV: development
      SHAPE_CRON_PATTERN: '*/10 * * * * *'
    volumes:
      - ./:/app/
      - ../app-ldes-monitor/data/ldes-watchman:/data/
    ports:
      - '8080:80'
      - '9228:9229'
    networks:
      - app-ldes-monitor_default

networks:
  app-ldes-monitor_default:
    external: true
